[package]
name = "dowse"
version = "1.0.0"
edition = "2024"
description = "Search code across many repositories, from a desktop app or the command line"
license = "MIT"

[[bin]]
name = "dowse"
path = "src/main.rs"

# The command line on Windows, where the app is a GUI program that a
# terminal does not wait for. Install it as `dowse.com` beside `dowse.exe`:
# a terminal then runs it for `dowse`, and Explorer runs the app.
[[bin]]
name = "dowse-cli"
path = "src/bin/dowse-cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
gpui-kit = { version = "0.6.6", features = ["tree-sitter-languages"] }
memchr = "2"
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1"
# Only for their highlights queries, which gpui-kit leaves out (see src/ui/highlight.rs).
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-swift = "0.7"
tgrep-core ={ git = "https://github.com/microsoft/tgrep", rev = "69e4fd05674403baf3e482a597cb2d24fbedc581" }
which = "7"
dirs = "6"
interprocess = "2.4.4"
log = "0.4"
async-channel = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The Windows programs' icon (see build.rs).
embed-resource = "3"

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
